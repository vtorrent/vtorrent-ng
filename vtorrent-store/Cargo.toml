[package]
name = "vtorrent-store"
version = "0.1.0"
edition = "2021"
description = "Persistent block and UTXO storage for vTorrent using redb"

[dependencies]
vtorrent-node = { path = "../vtorrent-node" }
redb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }
