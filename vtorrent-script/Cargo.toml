[package]
name = "vtorrent-script"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Script engine for vTorrent: P2PKH, P2SH, multisig, HTLC, and OP_RETURN"

[dependencies]
# Cryptography
secp256k1  = { version = "0.29", features = ["global-context", "rand-std", "recovery"] }
sha2       = "0.10"
ripemd     = "0.1"
hex        = "0.4"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror  = "1"

# Logging
tracing    = "0.1"

[dev-dependencies]
secp256k1  = { version = "0.29", features = ["global-context", "rand-std", "recovery"] }
