rule_files:
  - vtorrent-alerts.yml

evaluation_interval: 1m

tests:
  - name: stale BTC scan fires after the grace period and resolves on recovery
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '1+0x20'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="probe"}'
        values: '1+0x14 900+60x5'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: BtcSpvScanStale
        exp_alerts: []
      - eval_time: 14m
        alertname: BtcSpvScanStale
        exp_alerts:
          - exp_labels:
              instance: probe
              severity: warning
            exp_annotations:
              summary: BTC SPV scan stale on probe
              description: No successful BTC SPV scan in the last 10 minutes.
      - eval_time: 17m
        alertname: BtcSpvScanStale
        exp_alerts: []

  - name: caught-up BTC scans do not alert
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '1+0x20'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="probe"}'
        values: '0+60x20'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: BtcSpvScanStale
        exp_alerts: []

  - name: disabled or unsynced BTC does not produce a stale-scan alert
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '0+0x20'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="probe"}'
        values: '0+0x20'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: BtcSpvScanStale
        exp_alerts: []

  - name: absent timestamp is not treated as a timestamp of zero
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '1+0x20'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: BtcSpvScanStale
        exp_alerts: []

  - name: initial scan in progress does not alert before its first completion
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '1+0x20'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '1+0x20'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="probe"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: BtcSpvScanStale
        exp_alerts: []

  - name: a scan running for more than 30 minutes alerts
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '1+0x50'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '1+0x50'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="probe"}'
        values: '0+0x50'
    alert_rule_test:
      - eval_time: 20m
        alertname: BtcSpvScanStuck
        exp_alerts: []
      - eval_time: 40m
        alertname: BtcSpvScanStuck
        exp_alerts:
          - exp_labels:
              instance: probe
              severity: warning
            exp_annotations:
              summary: BTC SPV scan stuck on probe
              description: A BTC SPV scan has been running for more than 30 minutes.

  - name: expected BTC scan memory is suppressed from the steady-state RSS alert
    interval: 1m
    input_series:
      - series: 'vtorrent_process_rss_bytes{instance="probe"}'
        values: '300000000+0x40'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ProcessRssHigh
        exp_alerts: []

  - name: sustained high RSS outside a scan still alerts
    interval: 1m
    input_series:
      - series: 'vtorrent_process_rss_bytes{instance="probe"}'
        values: '300000000+0x40'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ProcessRssHigh
        exp_alerts:
          - exp_labels:
              instance: probe
              severity: warning
            exp_annotations:
              summary: probe RSS above 256 MiB
              description: Daemon resident memory exceeded the soak budget for 10 minutes.
