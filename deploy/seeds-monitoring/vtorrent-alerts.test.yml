rule_files:
  - vtorrent-alerts.yml

evaluation_interval: 1m

tests:
  - name: spv that never completes a first sync alerts, and stays quiet when BTC is disabled
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '0+0x200'
      - series: 'vtorrent_btc_configured{instance="probe"}'
        values: '1+0x200'
      - series: 'vtorrent_uptime_seconds{instance="probe"}'
        values: '0+60x200'
      - series: 'vtorrent_btc_synced{instance="disabled"}'
        values: '0+0x200'
      - series: 'vtorrent_btc_configured{instance="disabled"}'
        values: '0+0x200'
      - series: 'vtorrent_uptime_seconds{instance="disabled"}'
        values: '0+60x200'
    alert_rule_test:
      - eval_time: 60m
        alertname: BtcSpvNeverSynced
        exp_alerts: []
      - eval_time: 140m
        alertname: BtcSpvNeverSynced
        exp_alerts:
          - exp_labels:
              instance: probe
              severity: critical
            exp_annotations:
              summary: BTC SPV has never synced on probe
              description: BTC SPV has not completed a first header sync; the wallet and swaps cannot see funding.

  - name: missing retained wallet history alerts and resolves after recovery
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_wallet_history_blocked{instance="probe"}'
        values: '1+0x7 0+0x4'
    alert_rule_test:
      - eval_time: 4m
        alertname: BtcWalletHistoryUnavailable
        exp_alerts: []
      - eval_time: 6m
        alertname: BtcWalletHistoryUnavailable
        exp_alerts:
          - exp_labels:
              instance: probe
              severity: critical
            exp_annotations:
              summary: BTC wallet history unavailable on probe
              description: BTC wallet requires history older than retained headers; increase retention and rescan.
      - eval_time: 10m
        alertname: BtcWalletHistoryUnavailable
        exp_alerts: []

  - name: stale BTC scan fires after the grace period and resolves on recovery
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '1+0x20'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="probe"}'
        values: '1+0x14 900+60x5'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: BtcSpvScanStale
        exp_alerts: []
      - eval_time: 14m
        alertname: BtcSpvScanStale
        exp_alerts:
          - exp_labels:
              instance: probe
              severity: warning
            exp_annotations:
              summary: BTC SPV scan stale on probe
              description: No successful BTC SPV scan in the last 10 minutes.
      - eval_time: 17m
        alertname: BtcSpvScanStale
        exp_alerts: []

  - name: caught-up BTC scans do not alert
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '1+0x20'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="probe"}'
        values: '0+60x20'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: BtcSpvScanStale
        exp_alerts: []

  - name: disabled or unsynced BTC does not produce a stale-scan alert
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '0+0x20'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="probe"}'
        values: '0+0x20'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: BtcSpvScanStale
        exp_alerts: []

  - name: absent timestamp is not treated as a timestamp of zero
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '1+0x20'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: BtcSpvScanStale
        exp_alerts: []

  - name: initial scan in progress does not alert before its first completion
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '1+0x20'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '1+0x20'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="probe"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: BtcSpvScanStale
        exp_alerts: []

  - name: a stale scan alerts after the hold
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="probe"}'
        values: '1+0x50'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '1+0x50'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="probe"}'
        values: '1+0x50'
    alert_rule_test:
      - eval_time: 20m
        alertname: BtcSpvScanStuck
        exp_alerts: []
      - eval_time: 40m
        alertname: BtcSpvScanStuck
        exp_alerts: []
      - eval_time: 42m
        alertname: BtcSpvScanStuck
        exp_alerts:
          - exp_labels:
              instance: probe
              severity: warning
            exp_annotations:
              summary: BTC SPV scan stuck on probe
              description: A BTC SPV scan has made no progress for more than 40 minutes.

  - name: a scan that keeps succeeding does not alert as stuck
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="progress"}'
        values: '1+0x50'
      - series: 'vtorrent_btc_scan_in_progress{instance="progress"}'
        values: '1+0x50'
      - series: 'vtorrent_btc_last_scanned_height{instance="progress"}'
        values: '0+1000x50'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="progress"}'
        values: '0+60x50'
    alert_rule_test:
      - eval_time: 40m
        alertname: BtcSpvScanStuck
        exp_alerts: []

  - name: a first sync that runs long does not page as a stuck scan
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="boot"}'
        values: '0+0x50'
      - series: 'vtorrent_btc_scan_in_progress{instance="boot"}'
        values: '1+0x50'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="boot"}'
        values: '0+0x50'
    alert_rule_test:
      - eval_time: 40m
        alertname: BtcSpvScanStuck
        exp_alerts: []

  - name: an initial scan gets a full hour before it pages
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="first"}'
        values: '1+0x70'
      - series: 'vtorrent_btc_scan_in_progress{instance="first"}'
        values: '1+0x70'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="first"}'
        values: '0+0x70'
      - series: 'vtorrent_btc_last_scanned_height{instance="first"}'
        values: '0+0x70'
      - series: 'vtorrent_btc_best_height{instance="first"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 50m
        alertname: BtcSpvInitialScanSlow
        exp_alerts: []
      - eval_time: 61m
        alertname: BtcSpvInitialScanSlow
        exp_alerts:
          - exp_labels:
              instance: first
              severity: warning
            exp_annotations:
              summary: BTC SPV initial scan has not completed on first
              description: The first BTC SPV wallet scan has run for more than 60 minutes without completing a batch.

  - name: a synced wallet that is behind and not scanning pages as idle
    interval: 1m
    input_series:
      - series: 'vtorrent_btc_synced{instance="idle"}'
        values: '1+0x40'
      - series: 'vtorrent_btc_scan_in_progress{instance="idle"}'
        values: '0+0x40'
      - series: 'vtorrent_btc_last_scan_timestamp_seconds{instance="idle"}'
        values: '0+0x40'
      - series: 'vtorrent_btc_last_scanned_height{instance="idle"}'
        values: '0+0x40'
      - series: 'vtorrent_btc_best_height{instance="idle"}'
        values: '100+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: BtcSpvScanIdle
        exp_alerts: []
      - eval_time: 31m
        alertname: BtcSpvScanIdle
        exp_alerts:
          - exp_labels:
              instance: idle
              severity: warning
            exp_annotations:
              summary: BTC SPV scan is idle behind the header tip on idle
              description: BTC headers are synced but the wallet scan is not running and is behind the header tip.

  - name: expected BTC scan memory is suppressed from the steady-state RSS alert
    interval: 1m
    input_series:
      - series: 'vtorrent_process_rss_bytes{instance="probe"}'
        values: '300000000+0x40'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ProcessRssHigh
        exp_alerts: []

  - name: sustained high RSS outside a scan still alerts
    interval: 1m
    input_series:
      - series: 'vtorrent_process_rss_bytes{instance="probe"}'
        values: '300000000+0x40'
      - series: 'vtorrent_btc_scan_in_progress{instance="probe"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ProcessRssHigh
        exp_alerts:
          - exp_labels:
              instance: probe
              severity: warning
            exp_annotations:
              summary: probe RSS above 256 MiB
              description: Daemon resident memory exceeded the soak budget for 10 minutes.
