route:
  receiver: ntfy-push
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  # A lost ntfy push must not hide a critical alert for a whole shift.
  repeat_interval: 1h

receivers:
  - name: ntfy-push
    webhook_configs:
      - url: http://127.0.0.1:9094/
        send_resolved: true
