groups:
  - name: vtorrent-seeds
    rules:
      - alert: DaemonDown
        expr: up{job="vtorrent-daemon"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "vTorrent daemon unreachable on {{ $labels.instance }}"
          description: "Prometheus cannot scrape /metrics for 2+ minutes."

      - alert: PeerCountZero
        expr: vtorrent_peer_count == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has no P2P peers"
          description: "Seed node lost all peer connections for 5+ minutes."

      - alert: HeightStalled
        expr: max_over_time(vtorrent_block_height[1h]) > 0 and changes(vtorrent_block_height[1h]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Height stalled on {{ $labels.instance }}"
          description: "Chain had blocks but height did not change for 1h (silent while pre-launch at height 0)."

      - alert: StakingStopped
        expr: vtorrent_staking_enabled == 0 and on(instance) max_over_time(vtorrent_staking_enabled[24h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Staking stopped on {{ $labels.instance }}"

      - alert: BlockCadenceSlow
        expr: max_over_time(vtorrent_block_height[1h]) > 0 and deriv(vtorrent_block_height[15m]) * 120 < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Block cadence slower than 120s on {{ $labels.instance }}"
          description: "Fewer than one block per 120 seconds over 15 minutes."

      - alert: SyncLag
        expr: vtorrent_block_height < vtorrent_best_peer_height - 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is behind its peers"
          description: "Local height is more than 10 blocks below the best peer height."

      - alert: ProcessRssHigh
        expr: vtorrent_process_rss_bytes > 220 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} RSS above 220 MiB"
          description: "Daemon resident memory exceeded the soak budget for 10 minutes."

      - alert: BtcSpvStalled
        expr: vtorrent_btc_synced == 0 and on(instance) max_over_time(vtorrent_btc_synced[24h]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "BTC SPV stalled on {{ $labels.instance }}"
          description: "BTC SPV was synced in the last 24h but is not synced now."

      - alert: BtcSpvScanStale
        expr: vtorrent_btc_synced == 1 and vtorrent_btc_scan_in_progress == 0 and vtorrent_btc_last_scan_timestamp_seconds > 0 and time() - vtorrent_btc_last_scan_timestamp_seconds > 600
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "BTC SPV scan stale on {{ $labels.instance }}"
          description: "No successful BTC SPV scan in the last 10 minutes."

      - alert: HostDiskFull
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk below 15% free on {{ $labels.instance }}"

      - alert: HostOutOfMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Available memory below 10% on {{ $labels.instance }}"
