# Install on seed1 as /etc/ssh/sshd_config.d/deadman.conf (or append to
# sshd_config). Applies only to the dedicated dead-man account, so the normal
# operator SSH access is unaffected.
#
# The forced command makes the requested command irrelevant; see
# ../vtorrent-monitor-ready. Do not add ForwardAgent, permit port forwarding, or
# allow a pty for this account.
Match User deadman
    ForceCommand /usr/local/libexec/vtorrent-monitor-ready
    PermitTTY no
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    AllowStreamLocalForwarding no
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
