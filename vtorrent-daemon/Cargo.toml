[package]
name = "vtorrent-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "vTorrent full node daemon — P2P node + HTTP RPC server + PoS staking"

[[bin]]
name = "vtorrent-daemon"
path = "src/main.rs"

[dependencies]
vtorrent-node     = { path = "../vtorrent-node" }
vtorrent-rpc      = { path = "../vtorrent-rpc" }
vtorrent-store    = { path = "../vtorrent-store" }
vtorrent-spv      = { path = "../vtorrent-spv" }
vtorrent-onion    = { path = "../vtorrent-onion" }
vtorrent-btc      = { path = "../vtorrent-btc" }
vtorrent-torrent  = { path = "../vtorrent-torrent" }
vtorrent-wallet   = { path = "../vtorrent-wallet" }
vtorrent-wallet-service = { path = "../vtorrent-wallet-service" }

# Async runtime
tokio             = { version = "1", features = ["full"] }

# CLI argument parsing
clap              = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow            = "1"

# Logging
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Encoding
hex               = "0.4"
serde_json        = { workspace = true }
bitcoin           = { workspace = true }

[dev-dependencies]
axum             = { version = "0.7", features = ["http1", "http2", "json", "tokio"] }
sha2             = "0.10"
tower            = { version = "0.4", features = ["util"] }
serde_json       = "1"
tokio            = { version = "1", features = ["full"] }
