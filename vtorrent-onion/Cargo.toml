[package]
name = "vtorrent-onion"
version = "0.1.0"
edition = "2021"
description = "Tor/I2P transport layer for vTorrent — anonymous P2P routing"

[dependencies]
tokio       = { workspace = true, features = ["full"] }
serde       = { workspace = true, features = ["derive"] }
sha2        = { workspace = true }
base64      = { workspace = true }
tracing     = { workspace = true }
rand        = { workspace = true }
thiserror   = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
