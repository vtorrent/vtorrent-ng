[package]
name = "vtorrent-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vtorrent-node"
path = "src/main.rs"

[dependencies]
vtorrent-core     = { path = "../vtorrent-core" }
vtorrent-wallet   = { path = "../vtorrent-wallet" }
vtorrent-p2p      = { path = "../vtorrent-p2p" }
vtorrent-snapshot = { path = "../vtorrent-snapshot" }

# Async runtime
tokio             = { version = "1", features = ["full"] }

# Serialization
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
bincode           = "1"

# Crypto
sha2              = "0.10"
hex               = "0.4"
rand              = "0.8"

# Error handling
thiserror         = "1"
anyhow            = "1"

# Logging
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Storage
rusty-leveldb     = { version = "1.0", default-features = false }
