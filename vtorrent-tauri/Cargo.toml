[package]
name = "vtorrent-tauri"
version = "2.0.0-beta.2"
edition = "2021"
description = "vTorrent 2.0 Tauri desktop application backend"

[lib]
name = "vtorrent_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vtorrent-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vtorrent-core    = { path = "../vtorrent-core" }
vtorrent-migrate = { path = "../vtorrent-migrate" }
vtorrent-wallet  = { path = "../vtorrent-wallet" }
vtorrent-wallet-service = { path = "../vtorrent-wallet-service" }
vtorrent-node    = { path = "../vtorrent-node" }
vtorrent-rpc     = { path = "../vtorrent-rpc" }
vtorrent-torrent = { path = "../vtorrent-torrent" }
vtorrent-btc     = { path = "../vtorrent-btc" }
hex = "0.4"
bitcoin = { workspace = true }
sha2 = { workspace = true }
secp256k1 = { workspace = true }

# Tauri v2 framework
tauri       = { version = "2", features = [] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
base64      = "0.22"
tokio       = { version = "1", features = ["full"] }
tokio-util  = { workspace = true }
thiserror   = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
