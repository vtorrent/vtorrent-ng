name: Release checksums

# SHA256SUMS detects corrupted or partially uploaded assets. When
# MINISIGN_SECRET_KEY is configured, it also carries a minisign signature over
# the checksum file; see docs/release-signing.md. Checksums alone do not prove
# who built an asset.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  checksums:
    name: Publish SHA256SUMS
    runs-on: ubuntu-latest
    # Requires a protected environment (reviewers / deployment branches) so a
    # compromised token cannot publish or sign a release on its own. Configure
    # `release` in the repository settings before enabling signing.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "release tag $GITHUB_REF_NAME points at $(git rev-parse HEAD), which is not on main" >&2
            exit 1
          fi

      - name: Generate and verify checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --dir dist --clobber
          rm -f dist/SHA256SUMS dist/SHA256SUMS.minisig
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.tmp
          test -s SHA256SUMS.tmp || { echo "release has no assets" >&2; exit 1; }
          sha256sum -c SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS

      - name: Publish checksums and optional signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          VTR_REQUIRE_SIGNING: ${{ vars.VTR_REQUIRE_SIGNING }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            if [ -f release/minisign.pub ] || [ "${VTR_REQUIRE_SIGNING:-}" = "1" ]; then
              echo "signing is required (public key or VTR_REQUIRE_SIGNING=1) but MINISIGN_SECRET_KEY is not set; refusing to publish unsigned" >&2
              exit 1
            fi
            echo "MINISIGN_SECRET_KEY is not set; publishing unsigned checksums"
            gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS --clobber
            exit 0
          fi
          test -f release/minisign.pub || {
            echo "release/minisign.pub must be committed when signing is enabled" >&2
            exit 1
          }
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y minisign
          fi
          key="$RUNNER_TEMP/minisign.key"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          minisign -S -s "$key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
          minisign -Vm dist/SHA256SUMS -p release/minisign.pub -x dist/SHA256SUMS.minisig
          gh release upload "$GITHUB_REF_NAME" \
            dist/SHA256SUMS dist/SHA256SUMS.minisig --clobber
