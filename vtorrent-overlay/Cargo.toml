[package]
name = "vtorrent-overlay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "vTorrent NAT traversal overlay — UDP hole punching, STUN discovery, X25519/ChaCha20 encryption"

[package.metadata.cargo-machete]
ignored = ["hex"]

[dependencies]
# Async runtime
tokio             = { version = "1", features = ["full"] }

# Cryptography — X25519 key exchange + ChaCha20-Poly1305 AEAD
x25519-dalek      = { workspace = true }
chacha20poly1305  = { workspace = true }
rand              = { workspace = true }
zeroize           = { workspace = true }

# Serialization
serde             = { version = "1", features = ["derive"] }

# Encoding
hex               = { workspace = true }

# Error handling
thiserror         = "1"

# Logging
tracing           = "0.1"

# SHA2 for node ID derivation
sha2              = { workspace = true }

[dev-dependencies]
tokio             = { version = "1", features = ["full", "test-util"] }
tempfile          = { workspace = true }
