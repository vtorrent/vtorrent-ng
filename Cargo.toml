[workspace]
resolver = "2"
members = [
    "vtorrent-core",
    "vtorrent-wallet",
    "vtorrent-migrate",
    "vtorrent-tauri",
    "vtorrent-snapshot",
    "vtorrent-node",
    "vtorrent-p2p",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["vTorrent Dev <vtorrent.crypto@gmail.com>"]
license = "MIT"
repository = "https://github.com/vtorrent/vtorrent-new"

[workspace.dependencies]
# Cryptography
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
hmac = "0.12"
pbkdf2 = "0.12"
argon2 = "0.5"
chacha20poly1305 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
totp-rs = { version = "5", features = ["qr", "gen_secret"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Encoding
bs58 = "0.5"
hex = "0.4"
base64 = "0.22"
base32 = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
rocksdb = "0.22"

# Networking
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "gossipsub", "kad", "identify", "ping"] }
