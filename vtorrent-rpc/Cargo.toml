[package]
name = "vtorrent-rpc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vtorrent-core    = { path = "../vtorrent-core" }
vtorrent-node    = { path = "../vtorrent-node" }
vtorrent-wallet  = { path = "../vtorrent-wallet" }
vtorrent-torrent = { path = "../vtorrent-torrent" }
vtorrent-spv     = { path = "../vtorrent-spv" }
vtorrent-btc     = { path = "../vtorrent-btc" }

# HTTP server
axum = { version = "0.7", features = ["json", "macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { workspace = true }
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { workspace = true }

# Error handling
thiserror = "1"
anyhow = "1"

# Encoding
hex = "0.4"
base64 = "0.21"

# Crypto
secp256k1 = { workspace = true }
sha2 = { workspace = true }
bitcoin = { workspace = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.4", features = ["util"] }
